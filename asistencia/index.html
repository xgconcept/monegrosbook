const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.v)},key,u8(P.c));
  const ds=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(ds).text();
}
async function go(pw,quiet){
  const b=document.getElementById('go'),e=document.getElementById('err');
  b.disabled=true;b.textContent='Abriendo…';e.textContent='';
  try{
    const html=await open(pw);
    try{sessionStorage.setItem('mb_asis',pw)}catch(_){}
    const h=location.hash;document.open();document.write(html);document.close();
    if(h){setTimeout(()=>{const t=document.getElementById(h.slice(1));if(t)t.scrollIntoView()},50)}
  }catch(x){
    b.disabled=false;b.textContent='Entrar';
    if(!quiet)e.textContent=(window.crypto&&crypto.subtle&&window.DecompressionStream)?'Contraseña incorrecta':'Este navegador es muy antiguo: abre el enlace con Chrome o Safari actualizados.';
  }
}
document.getElementById('f').addEventListener('submit',ev=>{ev.preventDefault();go(document.getElementById('pw').value.trim().toUpperCase())});
try{const s=sessionStorage.getItem('mb_asis');if(s)go(s,true)}catch(_){}

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Equipo de asistencia en ruta · MonegrosBook 2026</title>
<style>
:root{--azul:#0F4270;--amarillo:#FABD12;--ink:#141413;--sub:#5a5850}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f3ee;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);padding:16px}
.card{background:#fff;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.08);padding:28px 24px;max-width:380px;width:100%;border-top:6px solid var(--amarillo)}
h1{margin:0 0 4px;font-size:22px;color:var(--azul);letter-spacing:.01em;text-transform:uppercase}
p{margin:0 0 18px;color:var(--sub);font-size:14px}
input{width:100%;font-size:18px;padding:12px 14px;border:2px solid #d9d6cc;border-radius:8px;outline:none;letter-spacing:.08em}
input:focus{border-color:var(--azul)}
button{margin-top:12px;width:100%;font-size:17px;font-weight:700;padding:12px;border:0;border-radius:8px;background:var(--azul);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:#c0262d;font-size:14px;margin-top:10px;min-height:20px}
.foot{margin-top:18px;font-size:12px;color:#8a877e;text-align:center}
</style></head><body>
<form class="card" id="f" autocomplete="off">
<h1>Asistencia en ruta</h1>
<p>MonegrosBook 2026 · OffRoad · sábado 7 de noviembre. Acceso del equipo.</p>
<input id="pw" type="password" inputmode="text" autocapitalize="characters" placeholder="Contraseña" aria-label="Contraseña" autofocus>
<button id="go" type="submit">Entrar</button>
<div class="err" id="err" role="alert"></div>
<div class="foot">Operado por XG Concept</div>
</form>
<script>
const API="https://script.google.com/macros/s/AKfycbzFak0kBBUvmy61KyJp4U7I3UPwfkc5zhBcqmUd4mF3EykODIMwJluFD8Qcz4PHd0XI/exec?action=asis";
let P=null;
async function getP(){ if(P) return P; const r=await fetch(API+"&t="+Date.now(),{cache:"no-store"}); const j=await r.json(); if(!j||!j.p) throw new Error("datos"); P=j.p; return P; }
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  await getP();
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.v)},key,u8(P.c));
  const ds=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(ds).text();
}
async function go(pw,quiet){
  const b=document.getElementById('go'),e=document.getElementById('err');
  b.disabled=true;b.textContent='Abriendo…';e.textContent='';
  try{
    const html=await open(pw);
    try{sessionStorage.setItem('mb_asis',pw)}catch(_){}
    const h=location.hash;document.open();document.write(html);document.close();
    if(h){setTimeout(()=>{const t=document.getElementById(h.slice(1));if(t)t.scrollIntoView()},50)}
  }catch(x){
    b.disabled=false;b.textContent='Entrar';
    if(!quiet)e.textContent=!P?'No se ha podido cargar la página. Revisa la conexión y vuelve a intentarlo.':(window.crypto&&crypto.subtle&&window.DecompressionStream)?'Contraseña incorrecta':'Este navegador es muy antiguo: abre el enlace con Chrome o Safari actualizados.';
  }
}
document.getElementById('f').addEventListener('submit',ev=>{ev.preventDefault();go(document.getElementById('pw').value.trim().toUpperCase())});
try{const s=sessionStorage.getItem('mb_asis');if(s)go(s,true)}catch(_){}
</script></body></html>

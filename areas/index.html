<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MonegrosBook · Áreas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/mb.css">
<style>
:root{--bg:#0a0b0d;--panel:#121417;--panel2:#171a1e;--ink:#f5f3ee;--sub:#93979c;--hair:rgba(255,255,255,.1);--yel:#FABD12;--green:#33d488}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar-l{display:flex;align-items:center;gap:12px}
.bar .mb-logo{width:70px;height:34px;border-radius:6px}
h1{font:800 clamp(20px,3vw,28px)/1 "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}
.bar-r{display:flex;gap:8px;align-items:center}
.btn{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--panel2);border:1px solid var(--hair);border-radius:5px;padding:6px 10px;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--yel);color:var(--yel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--yel);display:inline-block}
.dot.live{background:var(--green)} .dot.err{background:#ff7a59}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--hair);border-radius:6px;padding:12px}
.name{font:700 16px/1.15 "Barlow Condensed",Arial,sans-serif;text-transform:uppercase}
.name b{color:var(--yel);font-weight:800;margin-right:6px}
.resp{font-size:12px;color:var(--sub);margin-bottom:4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.pdf{display:block;text-align:center;text-decoration:none;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;padding:8px 4px;border-radius:4px;border:1px solid var(--hair)}
.pdf.doss{background:rgba(127,184,217,.18);border-color:rgba(127,184,217,.6);color:#cfe8f6}
.pdf.ubic{background:rgba(250,189,18,.12);border-color:rgba(250,189,18,.55);color:#ffd766}
.pdf.off{opacity:.3;pointer-events:none;color:var(--sub)}
.pdf:hover{filter:brightness(1.2)}
.top{display:flex;justify-content:flex-end}
.badge{font:700 10px "IBM Plex Mono",monospace;letter-spacing:.05em;padding:3px 10px;border-radius:20px;cursor:pointer;background:rgba(250,189,18,.16);color:var(--yel);border:1px solid rgba(250,189,18,.55)}
.card.fin{border-color:rgba(51,212,136,.5)}
.card.fin .badge{background:rgba(51,212,136,.16);color:var(--green);border-color:rgba(51,212,136,.55)}
.badge:hover{filter:brightness(1.25)}
.empty{padding:24px;text-align:center;color:var(--sub);border:1px dashed var(--hair);border-radius:8px}
</style>
</head><body>
<div class="wrap">
 <div class="bar">
  <div class="bar-l"><a href="../" title="Menú"><span class="mb-logo"></span></a><h1>Áreas</h1></div>
  <div class="bar-r"><span class="dot" id="dot" title=""></span><a class="btn" href="../">← Menú</a><button class="btn" id="salir" type="button">Salir</button></div>
 </div>
 <div class="grid" id="grid"><p class="empty">Cargando…</p></div>
</div>
<script src="../assets/mb.js"></script>
<script>
(function(){
 // Áreas que aún no están en la hoja WEB_AREAS (se usan solo si falta su fila).
 var EXTRA=[{codigo:'A22',nombre:'Zona Staff y Descanso',responsable:'Rosa Arbonés',dossier_drive:'1a2tOs3yuqqw9b8WT773ZzkRoJD3RUf1j',ubic_drive:'1lgKge41VXg_wHBFx8EH6kBFWsBHCZAlM',extra:1}];
 var areas=[], busy=false;
 var D=function(id){return 'https://drive.google.com/file/d/'+id+'/view';};
 var $=function(s){return document.querySelector(s);}, esc=MB.esc;
 function setSync(k,t){var d=$('#dot');d.className='dot'+(k?' '+k:'');d.title=t;}
 function btn(id,cls,txt){return id?'<a class="pdf '+cls+'" href="'+D(id)+'" target="_blank" rel="noopener">'+txt+'</a>':'<span class="pdf off">'+txt+'</span>';}
 function render(){
  if(!areas.length){$('#grid').innerHTML='<p class="empty">Sin áreas.</p>';return;}
  $('#grid').innerHTML=areas.map(function(a){
   var fin=a.estado==='completa';
   return '<div class="card'+(fin?' fin':'')+'"><div class="top">'+(a.extra?'':'<button class="badge" type="button" data-tog="'+esc(a.codigo)+'" title="Cambiar estado">'+(fin?'TERMINADA':'POR FINALIZAR')+'</button>')+'</div><div class="name"><b>'+esc(a.codigo)+'</b>'+esc(a.nombre)+'</div>'+
    '<div class="resp">'+esc(a.responsable||'—')+'</div>'+
    '<div class="acts">'+btn(a.dossier_drive,'doss','PDF')+btn(a.ubic_drive,'ubic','Ubicación')+'</div></div>';
  }).join('');
 }
 async function load(){
  if(busy) return; busy=true;
  try{
   var j=await MB.call('areas'); areas=(j.areas||[]).slice();
   EXTRA.forEach(function(x){ if(!areas.some(function(a){return a.codigo===x.codigo;})) areas.push(x); });
   areas.sort(function(a,b){return String(a.codigo).localeCompare(String(b.codigo));});
   setSync('live','Al día '+MB.hm(j.ts)); render();
  }catch(e){ if(e.code==='clave'){MB.logout();return;} setSync('err','Sin conexión'); }
  finally{busy=false;}
 }
 async function toggle(c){
  var a=areas.filter(function(x){return x.codigo===c;})[0]; if(!a) return;
  var nx=a.estado==='completa'?'incompleta':'completa'; a.estado=nx; render();
  try{ var j=await MB.call('area.set',{codigo:c,fields:{estado:nx}}); MB.toast(c+(nx==='completa'?' → TERMINADA':' → POR FINALIZAR')); load(); }
  catch(e){ MB.toast('No se ha guardado. Prueba otra vez.'); load(); }
 }
 document.addEventListener('click',function(ev){var b=ev.target.closest('[data-tog]'); if(b) toggle(b.dataset.tog);});
 $('#salir').addEventListener('click',function(){MB.logout();});
 MB.gate({need:'gestion',title:'Áreas'}).then(function(){ load(); MB.poll(load,60000); });
})();
</script>
</body></html>
